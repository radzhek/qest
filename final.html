<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Твой подарок</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Arial', sans-serif;
    background: linear-gradient(180deg, #1e1b2e, #3a2f5c, #5a3f6b);
    color: #fff;
    text-align: center;
    overflow: hidden;
}

/* Кнопка запуска */
#startMusic {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,255,255,0.9);
    border: none;
    padding: 14px 26px;
    font-size: 17px;
    border-radius: 30px;
    cursor: pointer;
    z-index: 10;
}

/* Контейнер текста */
#text {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    font-size: 15px;
    line-height: 1.35;
    display: none;
}

/* Отдельные строки */
#text p {
    margin: 6px 0;
}

/* Снег и сердечки */
.snowflake {
    position: fixed;
    top: -10px;
    color: white;
    user-select: none;
    pointer-events: none;
    animation: fall linear infinite;
    opacity: 0.8;
}

.heart {
    color: #ff7aa2;
    opacity: 0.7;
}

@keyframes fall {
    to {
        transform: translateY(110vh);
    }
}
</style>
</head>

<body>

<button id="startMusic">Включить музыку</button>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="text"></div>

<script>
const button = document.getElementById("startMusic");
const music = document.getElementById("bgMusic");
const textBlock = document.getElementById("text");

const lines = [
    "Ты нашла его…",
    "Твой подарок!",
    "",
    "Хочу, чтобы этот новый год",
    "стал для тебя незабываемым,",
    "поводом на смелые и интересные шаги.",
    "",
    "Я всегда верил, верю",
    "и буду верить в тебя,",
    "как всегда любил, люблю",
    "и буду любить :)",
    "",
    "Всё, что ты загадаешь в этом году,",
    "обязательно сбудется.",
    "",
    "А я буду рядышком",
    "и прослежу за твоими",
    "гордыми шагами.",
    "",
    "С Новым Годом, любимая! 🎄❤️"
];

button.addEventListener("click", () => {
    music.volume = 0.4;
    music.play();
    button.style.display = "none";
    textBlock.style.display = "block";
    showText();
    startSnow();
});

function showText() {
    let i = 0;
    const interval = setInterval(() => {
        if (i < lines.length) {
            const p = document.createElement("p");
            p.textContent = lines[i];
            textBlock.appendChild(p);
            i++;
        } else {
            clearInterval(interval);
        }
    }, 1300);
}

function startSnow() {
    setInterval(() => {
        const el = document.createElement("div");
        const isHeart = Math.random() > 0.75;
        el.className = "snowflake" + (isHeart ? " heart" : "");
        el.textContent = isHeart ? "❤" : "❄";
        el.style.left = Math.random() * 100 + "vw";
        el.style.fontSize = (Math.random() * 8 + 10) + "px";
        el.style.animationDuration = (Math.random() * 5 + 6) + "s";
        document.body.appendChild(el);

        setTimeout(() => el.remove(), 12000);
    }, 400);
}
</script>

</body>
</html>
