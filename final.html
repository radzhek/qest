<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: radial-gradient(circle at top, #1a1a2e, #0e0e11);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    overflow: hidden;
}

.container {
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
    text-align: center;
}

.line {
    opacity: 0;
    animation: fadeIn 1.5s ease forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

.snow {
    position: fixed;
    top: -10px;
    font-size: 14px;
    animation: fall linear infinite;
    user-select: none;
}

@keyframes fall {
    to { transform: translateY(110vh); }
}
</style>
</head>

<body>

<audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2022/11/22/audio_4b8f8b47b6.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <div id="text"></div>
</div>

<script>
const lines = [
    "Ты нашла его… Твой подарок!",
    "",
    "Хочу, чтобы этот Новый год стал для тебя незабываемым,",
    "поводом для смелых и интересных шагов.",
    "",
    "Я всегда верил, верю и буду верить в тебя,",
    "как всегда любил, люблю и буду любить 🙂",
    "",
    "Пусть всё, что ты загадаешь в этом году, обязательно сбудется,",
    "а я буду рядышком и прослежу за твоими гордыми шагами.",
    "",
    "С Новым годом, любимая ❤️"
];

const textContainer = document.getElementById("text");

lines.forEach((line, i) => {
    const div = document.createElement("div");
    div.className = "line";
    div.style.animationDelay = (i * 1.2) + "s";
    div.innerHTML = line || "&nbsp;";
    textContainer.appendChild(div);
});

// снег + сердечки
for (let i = 0; i < 50; i++) {
    const el = document.createElement("div");
    el.className = "snow";
    el.textContent = Math.random() > 0.7 ? "❤️" : "❄️";
    el.style.left = Math.random() * 100 + "vw";
    el.style.animationDuration = 6 + Math.random() * 6 + "s";
    el.style.opacity = Math.random();
    document.body.appendChild(el);
}

// запуск музыки при первом касании
document.body.addEventListener("click", () => {
    document.getElementById("music").play();
}, { once: true });
</script>

</body>
</html>
