<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квест</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #2b2d4a, #4b3c6b, #6b4c7a);
    color: #fff;
    text-align: center;
}

.container {
    max-width: 90%;
    margin: auto;
    padding-top: 20vh;
}

.step {
    display: none;
}

h1 {
    font-size: 22px;
    margin-bottom: 10px;
}

p {
    font-size: 18px;
    margin-bottom: 20px;
}

input {
    width: 80%;
    padding: 10px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    margin-bottom: 15px;
}

button {
    padding: 12px 20px;
    font-size: 16px;
    border: none;
    border-radius: 20px;
    background: rgba(255,255,255,0.9);
    cursor: pointer;
}

.reset {
    margin-top: 30px;
    font-size: 14px;
    opacity: 0.7;
    cursor: pointer;
}

.find {
    font-size: 28px;
    margin-bottom: 30px;
}
</style>
</head>

<body>

<div class="container">

    <!-- ЭТАП 1 -->
    <div class="step" id="step1">
        <h1>Этап 1 из 5</h1>
        <p>Введи ответ</p>
        <input id="input1">
        <button onclick="check(1, 'диван')">Продолжить</button>
        <div class="reset" onclick="resetQuest()">Начать заново</div>
    </div>

    <!-- ЭТАП 2 -->
    <div class="step" id="step2">
        <h1>Этап 2 из 5</h1>
        <p>Введи ответ</p>
        <input id="input2">
        <button onclick="check(2, 'кровать')">Продолжить</button>
        <div class="reset" onclick="resetQuest()">Начать заново</div>
    </div>

    <!-- ЭТАП 3 -->
    <div class="step" id="step3">
        <h1>Этап 3 из 5</h1>
        <p>Введи ответ</p>
        <input id="input3">
        <button onclick="check(3, 'дверь')">Продолжить</button>
        <div class="reset" onclick="resetQuest()">Начать заново</div>
    </div>

    <!-- ЭТАП 4 -->
    <div class="step" id="step4">
        <h1>Этап 4 из 5</h1>
        <p>Введи ответ</p>
        <input id="input4">
        <button onclick="check(4, 'туалет')">Продолжить</button>
        <div class="reset" onclick="resetQuest()">Начать заново</div>
    </div>

    <!-- ЭТАП 5 -->
    <div class="step" id="step5">
        <h1>Этап 5 из 5</h1>
        <p>Введи ответ</p>
        <input id="input5">
        <button onclick="check(5, 'стол')">Продолжить</button>
        <div class="reset" onclick="resetQuest()">Начать заново</div>
    </div>

    <!-- ФИНАЛ -->
    <div class="step" id="end">
        <div class="find">Найди меня</div>
        <div class="reset" onclick="resetQuest()">Начать заново</div>
    </div>

</div>

<script>
const storageKey = "quest_step";

if (new URLSearchParams(window.location.search).get("reset")) {
    localStorage.removeItem(storageKey);
    history.replaceState({}, document.title, window.location.pathname);
}

const currentStep = localStorage.getItem(storageKey) || "step1";
showStep(currentStep);

function showStep(id) {
    document.querySelectorAll(".step").forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "block";
}

function check(step, answer) {
    const input = document.getElementById("input" + step).value.trim().toLowerCase();
    if (input === answer) {
        const next = step === 5 ? "end" : "step" + (step + 1);
        localStorage.setItem(storageKey, next);
        showStep(next);
    } else {
        alert("Попробуй ещё раз 💭");
    }
}

function resetQuest() {
    localStorage.removeItem(storageKey);
    showStep("step1");
}
</script>

</body>
</html>
